<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>NGA 阅读器</title>
<script>document.documentElement.dataset.theme = new URLSearchParams(location.search).get("theme") || localStorage.getItem("theme") || "nga";</script>
<link rel="stylesheet" href="themes.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside id="side">
  <div class="brand">
    <span>NGA 阅读器</span>
    <select id="themeSel" class="theme-sel" title="主题">
      <option value="nga">NGA 经典</option>
      <option value="light">简洁白</option>
      <option value="green">护眼绿</option>
      <option value="dark">深色</option>
    </select>
  </div>

  <section class="box account">
    <div class="acct-row">
      <span id="acctText">NGA 账号：检查中…</span>
      <button id="loginBtn" class="btn small">登录 NGA</button>
    </div>
    <div id="acctHint" class="acct-hint">未登录时 NGA 不返回用户名，部分昵称只能显示 UID。<a href="#" id="cookieLink">手动粘贴 Cookie</a></div>
  </section>

  <section class="box">
    <label class="lbl">帖子</label>
    <select id="tidSelect" class="wide-select"></select>
    <div class="row" style="margin-top:5px">
      <input id="tidInput" placeholder="或粘贴帖子链接 / tid">
      <button id="openBtn" class="btn small">打开</button>
    </div>
  </section>

  <section class="box topic">
    <div id="topicTitle" class="ttl">未加载</div>
    <div class="meta"><span>楼主</span><b id="topicAuthor">-</b></div>
    <div class="meta"><span>版面</span><b id="topicForum">-</b></div>
    <div class="meta"><span>总楼层</span><b id="topicRows">-</b></div>
    <div class="meta"><span>最后回复</span><b id="topicLast">-</b></div>
  </section>

  <section class="box">
    <button id="refreshBtn" class="btn primary wide">刷新</button>
    <div class="seg">
      <button id="allBtn" class="btn active">查看全部</button>
      <button id="opBtn" class="btn">只看楼主</button>
      <button id="userBtn" class="btn" title="输入昵称，只看这个人的发言；也可以直接点楼层里的用户名">指定用户</button>
    </div>
    <div id="userRow" class="row hidden" style="margin-top:6px">
      <input id="userInput" placeholder="输入用户昵称或 UID">
      <button id="userGo" class="btn small">查看</button>
    </div>
    <div class="seg">
      <button data-order="chat" class="btn order active" title="最新楼层在最下面，往上翻看更早的">最新在下</button>
      <button data-order="desc" class="btn order" title="最新楼层在最上面，往下翻看更早的">最新在上</button>
      <button data-order="asc" class="btn order" title="从第 1 楼开始往后看">从头看</button>
    </div>
    <label class="chk"><input type="checkbox" id="autoChk"> 自动刷新
      <select id="autoSec"><option value="30">30 秒</option><option value="60" selected>60 秒</option><option value="120">2 分钟</option><option value="300">5 分钟</option></select>
    </label>
  </section>

  <section class="box">
    <label class="lbl">按时间筛选</label>
    <div class="quick">
      <button class="btn tiny" data-range="1h">近 1 小时</button>
      <button class="btn tiny" data-range="3h">近 3 小时</button>
      <button class="btn tiny" data-range="today">今天</button>
      <button class="btn tiny" data-range="yesterday">昨天</button>
      <button class="btn tiny" data-range="7d">近 7 天</button>
      <button class="btn tiny" data-range="all">不限</button>
    </div>
    <div class="dt"><span>从</span><input type="datetime-local" id="fromInput"></div>
    <div class="dt"><span>到</span><input type="datetime-local" id="toInput"></div>
    <button id="applyRange" class="btn wide">应用时间范围</button>
  </section>

  <section class="box ai-box">
    <div class="ai-title">
      <label class="lbl">AI 分析</label>
      <a href="#" id="aiSettingsLink" class="ai-set">设置</a>
    </div>
    <div id="aiNotice" class="ai-notice hidden"></div>
    <div class="seg ai-range">
      <button class="btn tiny active" data-ai-range="today">今天</button>
      <button class="btn tiny" data-ai-range="3d">近 3 天</button>
      <button class="btn tiny" data-ai-range="7d">近 7 天</button>
      <button class="btn tiny" data-ai-range="view" title="使用上面「按时间筛选」的范围">筛选范围</button>
    </div>
    <label class="chk"><input type="checkbox" id="aiOpOnly" checked> 只分析楼主的发言</label>
    <div class="ai-presets">
      <button class="btn tiny" data-preset="summary">总结观点</button>
      <button class="btn tiny" data-preset="change">观点变化</button>
      <button class="btn tiny" data-preset="plan">预判与计划</button>
    </div>
    <textarea id="aiQuestion" rows="2" placeholder="自由提问，例如：楼主怎么看半导体？（Ctrl+Enter 发送）"></textarea>
    <button id="aiAskBtn" class="btn wide">提问</button>
  </section>

  <section class="box">
    <label class="lbl">跳到楼层</label>
    <div class="row">
      <input id="jumpInput" type="number" min="0" placeholder="例如 100000">
      <button id="jumpBtn" class="btn small">跳转</button>
    </div>
  </section>

  <section class="box status">
    <div id="viewDesc">-</div>
    <div id="loadedInfo">-</div>
    <div id="refreshInfo">-</div>
  </section>
</aside>

<main id="main">
  <div id="newBanner" class="banner hidden"></div>
  <div id="topSentinel"><span id="topText"></span></div>
  <div id="feed"></div>
  <div id="sentinel"><span id="footerText"></span></div>
</main>

<div id="nav">
  <div id="posInfo" class="hidden"></div>
  <button id="topBtn" title="回到顶部（Home）">↑ 顶部</button>
  <button id="bottomBtn" title="到已加载内容底部（End），会继续自动加载">↓ 底部</button>
</div>
<aside id="aiPanel" class="hidden">
  <div class="ai-head">
    <div>
      <div id="aiPanelTitle" class="ai-ptitle">AI 分析</div>
      <div id="aiPanelMeta" class="ai-pmeta"></div>
    </div>
    <div class="ai-actions">
      <button id="aiStopBtn" class="btn tiny stop hidden" title="停止生成，保留已输出的内容">停止</button>
      <button id="aiRegenBtn" class="btn tiny" title="忽略缓存重新生成">重新生成</button>
      <button id="aiCopyBtn" class="btn tiny">复制</button>
      <button id="aiCloseBtn" class="btn tiny">关闭</button>
    </div>
  </div>
  <div id="aiProgress" class="ai-progress"></div>
  <div id="aiOutput" class="ai-output md"></div>
  <div id="aiFoot" class="ai-foot"></div>
</aside>

<div id="aiModal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">AI 分析设置 <a href="#" id="aiModalClose">×</a></div>
    <label class="lbl">服务商</label>
    <select id="aiProvider" class="wide-select"></select>
    <div id="aiStatusLine" class="ai-status"></div>
    <div id="aiNote" class="ai-warn hidden"></div>

    <div id="aiBaseRow">
      <label class="lbl">接口地址（OpenAI 兼容，到 /v1 为止）</label>
      <input id="aiBaseUrl" class="wide-input" placeholder="https://example.com/v1" autocomplete="off">
    </div>

    <label class="lbl" id="aiKeyLabel">API Key</label>
    <input id="aiKeyInput" class="wide-input" type="password" autocomplete="off">
    <div class="ai-help"><a id="aiKeyLink" href="#" target="_blank">去获取 API Key</a>　Key 只保存在本机 <code>data\ai.json</code>，消耗的是你自己的额度。</div>

    <label class="lbl">模型</label>
    <div class="row">
      <select id="aiModelSelect"></select>
      <button id="aiModelLoad" class="btn small" title="重新获取模型列表">刷新</button>
    </div>
    <input id="aiModelInput" class="wide-input hidden" style="margin-top:5px" placeholder="手动输入模型名" autocomplete="off">

    <div class="row modal-actions">
      <button id="aiSave" class="btn primary">保存并设为当前使用</button>
      <button id="aiKeyClear" class="btn small">清除此服务商配置</button>
    </div>
    <div id="aiSafeNote" class="ai-help"></div>
  </div>
</div>

<div id="toast" class="hidden"></div>
<div id="lightbox" class="hidden"><img alt=""></div>

<script src="render.js"></script>
<script src="app.js"></script>
<script src="marked.min.js"></script>
<script src="ai.js"></script>
</body>
</html>
