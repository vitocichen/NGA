name: 手机版站点

on:
  # GitHub 定时任务在整点附近经常被延迟或跳过，错开到每 10 分钟的第 3 分钟
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "web/render.js"
      - "nga_api.py"
      - ".github/workflows/mobile-site.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mobile-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests

      # 游客拿不到用户名，昵称表要跨次运行累积
      - uses: actions/cache@v4
        with:
          path: data/names.json
          key: names-${{ github.run_id }}
          restore-keys: names-

      - name: 抓取并生成站点
        run: python mobile/build_site.py --out _site
        env:
          NGA_COOKIE: ${{ secrets.NGA_COOKIE }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # Pages 的 CDN 缓存 10 分钟且忽略查询参数；数据另推到 data 分支，强制更新时手机直接走 API 读取
      - name: 发布数据到 data 分支
        run: |
          cd _site/data
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "data $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data

      # 公开仓库 60 天无提交会停用定时任务；部署不产生提交，所以定期补一个空提交
      - name: 保持定时任务启用
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "保持定时任务启用"
            git push
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
